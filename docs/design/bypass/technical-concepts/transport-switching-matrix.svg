<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" fill="none">
  <defs>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("../../../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("../../../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2") format("woff2");
      }
      .sans { font-family: "Geist", ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: "Geist Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
      .label { fill: #f5f5f7; font-size: 15px; font-weight: 520; letter-spacing: .02em; }
      .meta { fill: #8c8d94; font-size: 12px; font-weight: 500; letter-spacing: .12em; }
      .lane { fill: #8c8d94; font-size: 13px; font-weight: 500; letter-spacing: .06em; }
    </style>
    <linearGradient id="ridge" x1="150" y1="0" x2="1450" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B4D2FF" stop-opacity="0"/>
      <stop offset=".22" stop-color="#B4D2FF" stop-opacity=".34"/>
      <stop offset=".5" stop-color="white"/>
      <stop offset=".78" stop-color="#B4D2FF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#B4D2FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="route" x1="350" y1="0" x2="1350" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F5F7" stop-opacity=".48"/>
      <stop offset=".48" stop-color="#F5F5F7"/>
      <stop offset="1" stop-color="#F5F5F7" stop-opacity=".68"/>
    </linearGradient>
    <filter id="ridgeGlow" x="0" y="40" width="1600" height="140" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="white" fill-opacity=".055"/>
    </pattern>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="white" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="innerClip">
      <rect x="100" y="120" width="1400" height="720" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1600" height="920" fill="#000"/>
  <g opacity=".78" filter="url(#ridgeGlow)">
    <path d="M150 102H1450" stroke="url(#ridge)" stroke-width="16"/>
  </g>
  <path d="M150 102H1450" stroke="url(#ridge)" stroke-width="2"/>

  <rect x="80.5" y="100.5" width="1439" height="759" rx="33.5" fill="#0A0A0C" fill-opacity=".92" stroke="white" stroke-opacity=".12"/>
  <rect x="100.5" y="120.5" width="1399" height="719" rx="23.5" fill="#030304" fill-opacity=".64" stroke="white" stroke-opacity=".055"/>

  <g clip-path="url(#innerClip)">
    <rect x="100" y="120" width="1400" height="720" fill="url(#dots)"/>
    <rect x="692" y="255" width="80" height="455" fill="url(#scan)"/>
    <path d="M732 255V710" stroke="white" stroke-opacity=".13"/>

    <text x="180" y="222" class="mono meta">TRANSPORT ADAPTATION</text>
    <text x="1420" y="222" text-anchor="end" class="mono meta">SESSION PRESERVED</text>
    <path d="M180 246H1420" stroke="white" stroke-opacity=".08"/>

    <text x="180" y="336" class="mono lane">TRANSPORT A</text>
    <text x="180" y="436" class="mono lane">TRANSPORT B</text>
    <text x="180" y="536" class="mono lane">TRANSPORT C</text>
    <text x="180" y="636" class="mono lane">TRANSPORT D</text>

    <path d="M350 330H1350" stroke="white" stroke-opacity=".085"/>
    <path d="M350 430H1350" stroke="white" stroke-opacity=".085"/>
    <path d="M350 530H1350" stroke="white" stroke-opacity=".085"/>
    <path d="M350 630H1350" stroke="white" stroke-opacity=".085"/>

    <path d="M350 330H704C744 330 759 362 780 405L823 493C834 516 851 530 884 530H1350" stroke="url(#route)" stroke-width="2.5"/>
    <path d="M772 330H1350" stroke="white" stroke-opacity=".035" stroke-dasharray="5 11"/>

    <circle cx="350" cy="330" r="6" fill="#F5F5F7"/>
    <circle cx="732" cy="350" r="5" fill="#000" stroke="#F5F5F7" stroke-width="1.5"/>
    <circle cx="884" cy="530" r="6" fill="#F5F5F7"/>
    <circle cx="1350" cy="530" r="6" fill="#F5F5F7"/>

    <path d="M732 292V270H840" stroke="white" stroke-opacity=".24"/>
    <text x="850" y="275" class="mono meta">INTERFERENCE DETECTED</text>
    <path d="M884 568V590H1032" stroke="white" stroke-opacity=".24"/>
    <text x="1042" y="595" class="mono meta">TRANSPORT CHANGED</text>

    <g opacity=".44">
      <rect x="370" y="314" width="36" height="32" rx="4" stroke="white" stroke-opacity=".18"/>
      <path d="M380 325H396M380 335H390" stroke="white" stroke-opacity=".34"/>
      <rect x="1268" y="514" width="36" height="32" rx="4" stroke="white" stroke-opacity=".18"/>
      <path d="M1278 525H1294M1278 535H1288" stroke="white" stroke-opacity=".34"/>
    </g>

    <text x="180" y="778" class="sans label">One session can move between available transports when the network starts interfering.</text>
  </g>
</svg>
