<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" fill="none">
  <defs>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("../../../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("../../../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2") format("woff2");
      }
      .sans { font-family: "Geist", ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: "Geist Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
      .label { fill: #f5f5f7; font-size: 15px; font-weight: 520; letter-spacing: .02em; }
      .meta { fill: #8c8d94; font-size: 12px; font-weight: 500; letter-spacing: .12em; }
      .event { fill: #b9bac0; font-size: 12px; font-weight: 500; letter-spacing: .06em; }
    </style>
    <linearGradient id="ridge" x1="150" y1="0" x2="1450" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B4D2FF" stop-opacity="0"/>
      <stop offset=".22" stop-color="#B4D2FF" stop-opacity=".34"/>
      <stop offset=".5" stop-color="white"/>
      <stop offset=".78" stop-color="#B4D2FF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#B4D2FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="timeline" x1="220" y1="0" x2="1380" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F5F7" stop-opacity=".42"/>
      <stop offset=".48" stop-color="#F5F5F7"/>
      <stop offset="1" stop-color="#F5F5F7" stop-opacity=".66"/>
    </linearGradient>
    <filter id="ridgeGlow" x="0" y="40" width="1600" height="140" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="white" fill-opacity=".055"/>
    </pattern>
    <clipPath id="innerClip">
      <rect x="100" y="120" width="1400" height="720" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1600" height="920" fill="#000"/>
  <g opacity=".78" filter="url(#ridgeGlow)">
    <path d="M150 102H1450" stroke="url(#ridge)" stroke-width="16"/>
  </g>
  <path d="M150 102H1450" stroke="url(#ridge)" stroke-width="2"/>

  <rect x="80.5" y="100.5" width="1439" height="759" rx="33.5" fill="#0A0A0C" fill-opacity=".92" stroke="white" stroke-opacity=".12"/>
  <rect x="100.5" y="120.5" width="1399" height="719" rx="23.5" fill="#030304" fill-opacity=".64" stroke="white" stroke-opacity=".055"/>

  <g clip-path="url(#innerClip)">
    <rect x="100" y="120" width="1400" height="720" fill="url(#dots)"/>

    <text x="180" y="220" class="mono meta">SESSION CONTINUITY</text>
    <text x="1420" y="220" text-anchor="end" class="mono meta">CONNECTION REMAINS ACTIVE</text>
    <path d="M180 246H1420" stroke="white" stroke-opacity=".08"/>

    <path d="M220 338H1380M220 430H1380M220 522H1380" stroke="white" stroke-opacity=".055"/>
    <path d="M220 614H1380" stroke="white" stroke-opacity=".08"/>
    <path d="M220 310V640M510 310V640M800 310V640M1090 310V640M1380 310V640" stroke="white" stroke-opacity=".045"/>

    <path d="M220 430H610C646 430 660 428 678 444C696 460 700 526 728 526C756 526 768 374 800 374C832 374 842 430 880 430H1380" stroke="url(#timeline)" stroke-width="2.5"/>
    <path d="M220 614H1380" stroke="white" stroke-opacity=".18"/>

    <circle cx="220" cy="430" r="6" fill="#F5F5F7"/>
    <circle cx="690" cy="470" r="5" fill="#000" stroke="#F5F5F7" stroke-width="1.5"/>
    <circle cx="800" cy="374" r="5" fill="#F5F5F7"/>
    <circle cx="920" cy="430" r="5" fill="#F5F5F7"/>
    <circle cx="1380" cy="430" r="6" fill="#F5F5F7"/>

    <path d="M690 300V640" stroke="white" stroke-opacity=".18" stroke-dasharray="4 8"/>
    <path d="M800 300V640" stroke="white" stroke-opacity=".12" stroke-dasharray="4 8"/>
    <path d="M920 300V640" stroke="white" stroke-opacity=".08" stroke-dasharray="4 8"/>

    <text x="652" y="286" text-anchor="end" class="mono meta">INTERFERENCE</text>
    <text x="728" y="286" class="mono meta">ADAPTATION</text>

    <path d="M220 670H690" stroke="white" stroke-opacity=".28"/>
    <path d="M800 670H1380" stroke="white" stroke-opacity=".48"/>
    <text x="220" y="700" class="mono event">TRANSPORT A</text>
    <text x="800" y="700" class="mono event">TRANSPORT B</text>

    <g class="mono event">
      <text x="570" y="586" text-anchor="end">INTERFERENCE DETECTED</text>
      <text x="800" y="586" text-anchor="middle">TRANSPORT CHANGED</text>
      <text x="1050" y="586">SESSION PRESERVED</text>
    </g>
    <path d="M590 580H668L690 558" stroke="white" stroke-opacity=".18"/>
    <path d="M800 568V550" stroke="white" stroke-opacity=".18"/>
    <path d="M1030 580H942L920 558" stroke="white" stroke-opacity=".18"/>

    <text x="180" y="778" class="sans label">A filtering event changes the transport, not the identity of the session.</text>
  </g>
</svg>
