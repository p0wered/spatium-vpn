      <path d="M680 470C704 470 704 418 728 418C752 418 752 526 776 526C800 526 800 398 824 398C848 398 848 510 872 510C896 510 896 450 920 450"/>
      <path d="M680 505C704 505 704 486 728 486C752 486 752 438 776 438C800 438 800 522 824 522C848 522 848 454 872 454C896 454 896 492 920 492" stroke-opacity=".26"/>
