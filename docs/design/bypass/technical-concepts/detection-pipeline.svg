      }
      @font-face {
        font-family: "Geist Mono";
        src: url("../../../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2") format("woff2");
      }
      .sans { font-family: "Geist", ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: "Geist Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
      .label { fill: #f5f5f7; font-size: 15px; font-weight: 520; letter-spacing: .02em; }
      .meta { fill: #8c8d94; font-size: 12px; font-weight: 500; letter-spacing: .12em; }
    </style>
    <linearGradient id="ridge" x1="150" y1="0" x2="1450" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B4D2FF" stop-opacity="0"/>
      <stop offset=".22" stop-color="#B4D2FF" stop-opacity=".34"/>
      <stop offset=".5" stop-color="white"/>
      <stop offset=".78" stop-color="#B4D2FF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#B4D2FF" stop-opacity="0"/>
